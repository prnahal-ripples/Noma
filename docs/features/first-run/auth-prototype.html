<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>NOMA — First run · nodes 1-5</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face { font-family:'Google Sans Flex'; src:url('../../../src/fonts/google-sans-flex/GoogleSansFlex-VariableFont_GRAD,ROND,opsz,slnt,wdth,wght.ttf') format('truetype');
  font-weight:1 1000; font-display:swap; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Google Sans Flex', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-optical-sizing:auto;
  background:#E8E8E5;color:#2E2E2C;display:flex;gap:32px;
  padding:32px;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ---- fit-to-viewport (docs/features/_phone_fit.py) ---------------------
   The phone is scaled, never resized: it must keep meaning 390 x 844pt.
   `.stage` is what it is scaled to fit, and it clips, because a scaled
   element still takes up its full unscaled size in layout. */
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  min-width:0;min-height:0;overflow:hidden;position:relative}
.phone{transform-origin:center center}


/* ---- review chrome — not part of the product ------------------------- */
.rail{width:236px;flex:none;align-self:stretch;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail__b{font-size:12px;line-height:16px;letter-spacing:0.96px;font-variation-settings:'opsz' 12,'wght' 600;text-transform:uppercase;color:#9E9E9C;margin-bottom:13px}
.rail__i{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;
  background:#FFFFFF;border:0;border-radius:12px;padding:10px 12px;margin-bottom:6px;
  font:inherit;font-size:13.5px;cursor:pointer;color:#767674;
  box-shadow:0px 1px 3px 0px rgba(0, 0, 0, 0.04), 0px 5px 14px 0px rgba(0, 0, 0, 0.07);
  transition:transform 140ms cubic-bezier(0.34, 1.56, 0.64, 1)}
.rail__i:hover{transform:translateX(2px)}
.rail__i[aria-current="true"]{color:#2E2E2C;font-variation-settings:'wght' 600;
  box-shadow:0px 2px 8px 0px rgba(0, 0, 0, 0.03), 0px 12px 32px 0px rgba(0, 0, 0, 0.06),inset 0 0 0 1px #FFFFFF}
.rail__n{font-size:10.5px;color:#9E9E9C;font-family:ui-monospace,Menlo,monospace}
.note{font-size:11.5px;line-height:1.68;color:#9E9E9C;margin-top:16px}
.note b{color:#767674;font-variation-settings:'wght' 600}

/* ---- phone ----------------------------------------------------------- */
.phone{width:390px;height:844px;flex:none;border-radius:52px;position:relative;
  overflow:hidden;background:#F4F3F1;box-shadow:0 40px 90px rgba(0,0,0,.16)}
.notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:33px;
  background:#0E0E0D;border-radius:20px;z-index:60}
.hbar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;
  background:rgba(0,0,0,.2);border-radius:3px;z-index:60}

.sbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px 0;color:#2E2E2C}
.sbar__t{font-size:15px;font-variation-settings:'wght' 600;letter-spacing:-.2px}
.sbar__r{display:flex;align-items:center;gap:5px}
.bat{width:25px;height:12px;border-radius:3.5px;border:1.3px solid currentColor;
  padding:1.4px;display:block}
.bat i{display:block;height:100%;width:88%;background:currentColor;border-radius:1.4px}

/* the image sits behind everything and never moves — the sheet moves on it */
.bg{position:absolute;inset:0;overflow:hidden}
/* A very slow settle out of a slight over-scale. At ambient (4s) over a
   ~1.5% move this is below the threshold of "an animation" and reads as the
   image being alive — which is the point: it holds the splash for the extra
   beat without the beat feeling empty. It also rehearses the video this
   becomes later. scale.breathe is the ceiling for ambient movement. */
.bg__svg,.bg__img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
  animation:bgSettle 4000ms cubic-bezier(0.2, 0, 0, 1) both}
@keyframes bgSettle{from{transform:scale(1.02)}
  to{transform:scale(1)}}

/* ---- the wordmark on the splash -------------------------------------- */
/* design-elements/brand/ — the real mark, sized by layout.wordmarkSplash /
   wordmarkSheet. `.mark img` carries no colour of its own: the source PNG is
   already ink-on-transparent, which is why it survives on the photo, the
   sheet's own gradient AND (via the --text fallback below) a plain ground. */
.mark{position:absolute;left:0;right:0;bottom:104px;
  text-align:center;z-index:15;
  transition:opacity 240ms cubic-bezier(0.4, 0, 1, 1),transform 240ms cubic-bezier(0.4, 0, 1, 1)}
/* The entrance lives on the IMG, the exit on its parent — an `animation` with
   `both` fill would otherwise pin the properties the exit transition needs. */
.mark img{display:inline-block;height:auto;
  animation:markIn 880ms cubic-bezier(0.16, 1, 0.3, 1) both}
@keyframes markIn{from{opacity:0;transform:translateY(16px)}}
.phone[data-sheet] .mark{opacity:0;transform:translateY(-16px)}
/* Fallback only — see wordmark()'s docstring. Reproduces the pre-2026-08-17
   letter-spaced text so a missing asset degrades instead of breaking. */
.mark--text,.mark--sheet--text{font-size:28px;line-height:34px;letter-spacing:-0.6px;font-variation-settings:'opsz' 28,'wght' 600;letter-spacing:.3em;text-indent:.3em;
  font-variation-settings:'opsz' 28,'wght' 600;
  color:#2E2E2C}
.mark--sheet--text{font-size:16px;line-height:22px;letter-spacing:0px;font-variation-settings:'opsz' 16,'wght' 600;margin-bottom:12px}

/* ---- the sheet ------------------------------------------------------- */
/* recipes.bottomSheet, floated off all four edges rather than docked to the
   bottom — that inset is what the reference frames show, and it is what makes
   the image read as continuing behind it. */
/* THE ARRIVAL — durations.entrance / easings.entrance, not the usual
   sheet+springBold pair. See the token comments: this is the once-per-install
   opening, so it settles rather than lands, and it is deliberately the one
   un-springy motion in the product. Subsequent state changes (A1->A2 and on)
   still use the quick fast/base swap below — only the FIRST arrival is slow,
   because only the first arrival is an introduction. */
/* THE CARD DESIGN — recipes.largeSurface, straight off the owner's Figma
   inspector 2026-08-19: radius 34 on all four corners at 100% corner
   smoothing, the #F9F9F9 + 24% gradient fill, a 1px WHITE INSIDE stroke, and
   a drop shadow.

   ⚠ TWO ELEMENTS, and it has to be two. A mask clips everything an element
   paints — its outer shadow included — so a masked sheet cannot cast one.
   `.sheet` is therefore the shell: it holds the shadow, the position and the
   transform, and its `border-radius` exists ONLY to give that shadow a shape.
   `.sheet__s` is the surface: the fill and the hairline, clipped to the real
   superellipse by docs/_squircle.py's 9-slice mask. The arc-vs-superellipse
   difference is invisible under a 48px blur, which is why the shadow can stay
   on a plain rounded rect without anyone being able to tell. */
.sheet{position:absolute;left:16px;right:16px;bottom:16px;
  z-index:30;border-radius:34px;
  box-shadow:0px 4px 12px 0px rgba(0, 0, 0, 0.05), 0px 20px 48px 0px rgba(0, 0, 0, 0.10);
  transform:translateY(calc(100% + 16px));
  transition:transform 880ms cubic-bezier(0.16, 1, 0.3, 1),
             height 240ms cubic-bezier(0.2, 0, 0, 1)}
.phone[data-sheet] .sheet{transform:translateY(0)}
/* the surface. `inset:0` so it tracks the shell at every height the sheet
   animates through — no script, no ResizeObserver, the 9-slice restretches. */
.sheet__s{position:absolute;inset:0;overflow:hidden;
  background:linear-gradient(180deg, #FAFAFA 0%, #F4F4F3 50%, #EEEEEC 100%);
  -webkit-mask-box-image:url(data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22138%22%20height%3D%22138%22%20viewBox%3D%220%200%20138%20138%22%3E%3Cpath%20d%3D%22M%2070%200%20c%2032.0555%200%2048.0833%200%2058.0416%209.9584%20a%2034%2034%200%200%201%200%200%20c%209.9584%209.9584%209.9584%2025.9861%209.9584%2058.0416%20L%20138%2070%20c%200%2032.0555%200%2048.0833%20-9.9584%2058.0416%20a%2034%2034%200%200%201%20-0%200%20c%20-9.9584%209.9584%20-25.9861%209.9584%20-58.0416%209.9584%20L%2068%20138%20c%20-32.0555%200%20-48.0833%200%20-58.0416%20-9.9584%20a%2034%2034%200%200%201%20-0%20-0%20c%20-9.9584%20-9.9584%20-9.9584%20-25.9861%20-9.9584%20-58.0416%20L%200%2068%20c%200%20-32.0555%200%20-48.0833%209.9584%20-58.0416%20a%2034%2034%200%200%201%200%20-0%20c%209.9584%20-9.9584%2025.9861%20-9.9584%2058.0416%20-9.9584%20Z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E) 68 stretch;mask-border:url(data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22138%22%20height%3D%22138%22%20viewBox%3D%220%200%20138%20138%22%3E%3Cpath%20d%3D%22M%2070%200%20c%2032.0555%200%2048.0833%200%2058.0416%209.9584%20a%2034%2034%200%200%201%200%200%20c%209.9584%209.9584%209.9584%2025.9861%209.9584%2058.0416%20L%20138%2070%20c%200%2032.0555%200%2048.0833%20-9.9584%2058.0416%20a%2034%2034%200%200%201%20-0%200%20c%20-9.9584%209.9584%20-25.9861%209.9584%20-58.0416%209.9584%20L%2068%20138%20c%20-32.0555%200%20-48.0833%200%20-58.0416%20-9.9584%20a%2034%2034%200%200%201%20-0%20-0%20c%20-9.9584%20-9.9584%20-9.9584%20-25.9861%20-9.9584%20-58.0416%20L%200%2068%20c%200%20-32.0555%200%20-48.0833%209.9584%20-58.0416%20a%2034%2034%200%200%201%200%20-0%20c%209.9584%20-9.9584%2025.9861%20-9.9584%2058.0416%20-9.9584%20Z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E) 68 stretch;border:68px solid transparent;border-image:url(data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22138%22%20height%3D%22138%22%20viewBox%3D%220%200%20138%20138%22%3E%3Cpath%20d%3D%22M%2070%200%20c%2032.0555%200%2048.0833%200%2058.0416%209.9584%20a%2034%2034%200%200%201%200%200%20c%209.9584%209.9584%209.9584%2025.9861%209.9584%2058.0416%20L%20138%2070%20c%200%2032.0555%200%2048.0833%20-9.9584%2058.0416%20a%2034%2034%200%200%201%20-0%200%20c%20-9.9584%209.9584%20-25.9861%209.9584%20-58.0416%209.9584%20L%2068%20138%20c%20-32.0555%200%20-48.0833%200%20-58.0416%20-9.9584%20a%2034%2034%200%200%201%20-0%20-0%20c%20-9.9584%20-9.9584%20-9.9584%20-25.9861%20-9.9584%20-58.0416%20L%200%2068%20c%200%20-32.0555%200%20-48.0833%209.9584%20-58.0416%20a%2034%2034%200%200%201%200%20-0%20c%209.9584%20-9.9584%2025.9861%20-9.9584%2058.0416%20-9.9584%20Z%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%222%22%2F%3E%3C%2Fsvg%3E) 68 stretch;background-origin:border-box;box-sizing:border-box}
/* ⚠ `border:68px` above is the 9-slice's
   canvas for the hairline, NOT padding — the sheet's real padding is on
   `.sheet__c`, which is why the surface must not be the layout parent. */
/* Every <p> in the sheet starts at margin 0 — the UA's 1em block margins
   were stacking on top of the rhythm values (the countdown alone added
   ~19 to its gap under the CTA). The rhythm tokens are the only vertical
   spacing in this component; nothing inherits leftovers. */
.sheet__c p,.sheet__c h1{margin:0}
.sheet__c{position:relative;z-index:1;
  padding:24px 20px 24px;
  display:flex;flex-direction:column;align-items:stretch;text-align:center}
.sheet[data-align="left"] .sheet__c{text-align:left}
/* content swap — out on exit easing (LAW: exits never bounce), in on spring */
.sheet__c{transition:opacity 140ms cubic-bezier(0.4, 0, 1, 1),transform 140ms cubic-bezier(0.4, 0, 1, 1)}
.sheet__c[data-out]{opacity:0;transform:translateY(-6px)}
.sheet__c[data-in]{animation:cin 240ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes cin{from{opacity:0;transform:translateY(16px)}}

/* First arrival only: the sheet's contents come up one after another as it
   settles, instead of the whole block appearing at once. Applied by JS on the
   splash -> A1 hand-off and never again — staggering every form step would
   make the flow feel slow rather than considered. */
.sheet__c--stagger > *{animation:cin 360ms cubic-bezier(0.16, 1, 0.3, 1) both}
.sheet__c--stagger > *:nth-child(1){animation-delay:396ms}.sheet__c--stagger > *:nth-child(2){animation-delay:441ms}.sheet__c--stagger > *:nth-child(3){animation-delay:486ms}.sheet__c--stagger > *:nth-child(4){animation-delay:531ms}.sheet__c--stagger > *:nth-child(5){animation-delay:576ms}.sheet__c--stagger > *:nth-child(6){animation-delay:621ms}.sheet__c--stagger > *:nth-child(7){animation-delay:666ms}.sheet__c--stagger > *:nth-child(8){animation-delay:711ms}

/* ---- type ------------------------------------------------------------ */
/* [OWNER FIGMA 2026-08-19] W56 at 50% opacity. A signature, not a headline —
   see layout.wordmarkSheet / wordmarkSheetOpacity. */
.mark--sheet{margin-bottom:12px;opacity:0.5}
.mark--sheet img{display:inline-block;height:auto}
/* rhythm (owner 2026-08-18): 12 within a text set, 24 between blocks —
   grounded against Airbnb and CRED sign-in flows on Mobbin. */
.sheet .eyebrow{font-size:12px;line-height:16px;letter-spacing:0.96px;font-variation-settings:'opsz' 12,'wght' 600;text-transform:uppercase;color:#767674;margin-bottom:12px}
/* margin:0 — the UA gives an h1 0.67em top AND bottom (20px at this size),
   which silently added ~20 to every gap around the title and is why the
   sheet read as over-spaced. The rhythm tokens are now the ONLY vertical
   spacing here. */
.sheet .h1{font-size:28px;line-height:34px;letter-spacing:-0.6px;font-variation-settings:'opsz' 28,'wght' 600;color:#2E2E2C;margin:0}
.sheet .sub{font-size:16px;line-height:22px;letter-spacing:0px;font-variation-settings:'opsz' 16,'wght' 400;color:#767674;margin:12px 0 0}
/* [OWNER FIGMA 2026-08-19] "Mixed 10" — one 10pt run, links at semibold. */
.sheet .fine{font-size:10px;line-height:15px;letter-spacing:0px;font-variation-settings:'opsz' 10,'wght' 400;color:#9E9E9C;margin-top:18px}
.sheet .fine b{color:#767674;
  font-variation-settings:'opsz' 10,'wght' 600}
.sheet .s-link{background:none;border:0;font:inherit;font-size:16px;line-height:22px;letter-spacing:0px;font-variation-settings:'opsz' 16,'wght' 600;
  color:#27753A;cursor:pointer;padding:0;margin-top:8px;
  align-self:flex-start}

/* ---- buttons --------------------------------------------------------- */
/* recipes.buttonPrimary — LAW 4, the CTA is ink and fully round. */
.sheet .s-cta{height:54px;width:100%;border:0;border-radius:999px;
  background:linear-gradient(180deg, #3A3A38 0%, #2E2E2C 100%);color:#FFFFFF;font:inherit;
  font-size:14px;line-height:18px;letter-spacing:0px;font-variation-settings:'opsz' 14,'wght' 600;cursor:pointer;box-shadow:0px 4px 12px 0px rgba(0, 0, 0, 0.06), 0px 14px 34px 0px rgba(0, 0, 0, 0.12);
  margin-top:24px;display:flex;align-items:center;justify-content:center;
  gap:8px;
  transition:transform 140ms cubic-bezier(0.34, 1.56, 0.64, 1),background 240ms cubic-bezier(0.2, 0, 0, 1),
             box-shadow 240ms cubic-bezier(0.2, 0, 0, 1)}
.sheet .s-cta:active{transform:scale(0.96)}
.sheet .s-cta[disabled]{background:#B8B8B6;box-shadow:none;cursor:default}
.sheet .s-cta[disabled]:active{transform:none}
/* follows the title directly, so titleGap (18) not sectionGap */
.sheet .s-cta--icon{margin-top:18px}
/* recipes.buttonQuiet — 46 tall, SHORTER than the 54 primary on purpose, and
   8 from whatever it stacks under. The height difference is half the
   hierarchy; matching the primary would make them read as equal choices. */
.sheet .ghost{height:46px;width:100%;border:0;font:inherit;
  background:#FFFFFF;border-radius:999px;
  box-shadow:0px 1px 3px 0px rgba(0, 0, 0, 0.04), 0px 5px 14px 0px rgba(0, 0, 0, 0.07);
  font-size:12px;line-height:16px;letter-spacing:0px;font-variation-settings:'opsz' 12,'wght' 600;color:#2E2E2C;cursor:pointer;
  margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform 140ms cubic-bezier(0.34, 1.56, 0.64, 1),background 240ms cubic-bezier(0.2, 0, 0, 1)}
.sheet .ghost--bare{background:none;box-shadow:none}
.sheet .ghost:active{transform:scale(0.96)}
/* recipes.buttonIcon — the white inside stroke is what makes it read as glass */
.sheet .iconbtn{width:40px;height:40px;border-radius:999px;
  background:#F8F8F8;border:0;display:grid;place-items:center;cursor:pointer;
  color:#2E2E2C;align-self:flex-start;margin-bottom:20px;
  box-shadow:0px 1px 3px 0px rgba(0, 0, 0, 0.04), 0px 5px 14px 0px rgba(0, 0, 0, 0.07),inset 0 0 0 1px #FFFFFF;
  transition:transform 140ms cubic-bezier(0.34, 1.56, 0.64, 1)}
/* pressing DARKENS a raised control; it does not brighten it */
.sheet .iconbtn:hover{background:#F1F1EF}
.sheet .iconbtn:active{transform:scale(0.96);background:#E8E8E5}

/* ---- input ----------------------------------------------------------- */
/* recipes.input — white raised field on the ground, radius 20, height 56. */
/* recipes.input, 2026-08-18: sunken well, not floating card — see the recipe
   comment in the token file. Section rhythm: 24 above (a field is a new
   block, not part of the title's text set). */
.sheet .field{display:flex;align-items:center;gap:12px;height:52px;
  border-radius:8px;background:#FFFFFF;
  padding:0 16px;
  border:1px solid rgba(0, 0, 0, 0.12);
  box-shadow:inset 0 1px 2px rgba(0, 0, 0, 0.06), inset 0 2px 6px rgba(0, 0, 0, 0.03);margin-top:24px;
  transition:border-color 240ms cubic-bezier(0.2, 0, 0, 1)}
.sheet .field:focus-within{border-color:#CCCAC4}
.sheet .field__cc{font-size:16px;line-height:22px;letter-spacing:0px;font-variation-settings:'opsz' 16,'wght' 600;color:#2E2E2C;flex:none}
.sheet .field__in{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;line-height:22px;letter-spacing:0px;font-variation-settings:'opsz' 16,'wght' 400;
  color:#2E2E2C;outline:0;caret-color:#27753A}
.sheet .field__in::placeholder{color:#9E9E9C}

/* ---- OTP ------------------------------------------------------------- */
.sheet .s-otp{position:relative;display:flex;gap:12px;justify-content:center;
  margin-top:24px}
.sheet .s-otp i{width:56px;height:52px;border-radius:16px;background:#FFFFFF;
  box-shadow:0px 1px 3px 0px rgba(0, 0, 0, 0.04), 0px 5px 14px 0px rgba(0, 0, 0, 0.07),inset 0 0 0 1px #FFFFFF;
  display:grid;place-items:center;font-style:normal;
  font-size:22px;line-height:27px;letter-spacing:-0.2px;font-variation-settings:'opsz' 22,'wght' 600;font-variation-settings:'opsz' 22,'wght' 700;
  color:#2E2E2C}
.sheet .s-otp i[data-filled]{animation:pop 140ms cubic-bezier(0.34, 1.56, 0.64, 1)}
@keyframes pop{from{transform:scale(1.04)}}
/* the caret lives in the active empty box */
.sheet .s-otp i[data-at]::after{content:'';width:2px;height:22px;background:#2E2E2C;
  animation:caret 1000ms step-end infinite}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
/* one transparent input across the whole row — see otp_row() */
.sheet .s-otp__in{position:absolute;inset:0;width:100%;opacity:0;border:0;background:none;
  font:inherit;cursor:pointer}
/* Error line. status.negative is the palette's only non-green hue and exists
   for exactly this: something that is wrong. `salmonDeep` because a label has
   to BE readable text on a light ground — the `salmon` anchor measures 2.09:1
   there and fails badly. Nothing in the owner's frames uses this; the three
   edge states in build-prototype.py that do are marked EXTRAPOLATED. */
.sheet .err{font-size:14px;line-height:19px;letter-spacing:0px;font-variation-settings:'opsz' 14,'wght' 400;color:#A03B3B;
  text-align:center;margin-top:8px}
.sheet[data-align="left"] .err{text-align:left}
.sheet .resend{font-size:14px;line-height:19px;letter-spacing:0px;font-variation-settings:'opsz' 14,'wght' 400;color:#767674;text-align:center;
  margin-top:8px}
.sheet .resend b{color:#2E2E2C;font-variation-settings:'wght' 600}
.sheet .resend__b{background:none;border:0;font:inherit;font-size:14px;line-height:19px;letter-spacing:0px;font-variation-settings:'opsz' 14,'wght' 400;
  font-variation-settings:'wght' 600;color:#27753A;cursor:pointer}

/* ---- the hand-off ---------------------------------------------------- */
.done{position:absolute;inset:0;z-index:40;display:none;place-items:center;
  background:linear-gradient(180deg, #FFFFFF 0%, #FDFDFC 38%, #DDDCD8 100%);text-align:center;padding:0 20px}

ass=\"field__in\" data-email type=\"email\" inputmode=\"email\"\n               placeholder=\"you@example.com\" aria-label=\"Email address\">\n      </div>\n      <button class=\"s-cta\" data-go=\"A3\" disabled>Proceed</button>\n", "note": "<b>Node 2 \u2014 was the mobile-number entry; now the same shape, for email (owner, 2026-08-19).</b> Proceed is inert until the address looks valid. No \u201cContinue with email\u201d variant collects this on the login sheet itself \u2014 it is always its own step, which is what makes A3's \u201cwe\u2019ve sent a code to ___\u201d legible."}, {"id": "A3", "align": "center", "inner": "\n      <p class=\"eyebrow\">Login with email</p>\n      <h1 class=\"h1 grad\">Enter the OTP</h1>\n      <div class=\"s-otp\" data-otp=\"A3\"><i data-i=\"0\"></i><i data-i=\"1\"></i><i data-i=\"2\"></i><i data-i=\"3\"></i><input class=\"s-otp__in\" inputmode=\"numeric\" autocomplete=\"one-time-code\" maxlength=\"4\" aria-label=\"One-time code\"></div>\n      <p class=\"resend\"><span data-resend>Resend OTP in <b>15s</b></span><button class=\"resend__b\" data-resendbtn hidden>Resend OTP</button></p>\n      <button class=\"s-cta\" data-go=\"DONE\" disabled>Proceed</button>\n", "note": "<b>Node 3 \u2014 was the mobile OTP; now email (owner, 2026-08-19).</b> Four digits, resend countdown visible from t=0. Proceed hands off to node 4, which now asks for the phone number instead of the email node 4 used to collect \u2014 see build-prototype.py's <code>mobile_field()</code>. <b>\u26a0 No way back</b>: a mistyped address strands you here, same gap the old mobile-OTP state had."}];
const RESEND_S = 15;

const phone = document.querySelector('.phone');
const sheet = document.querySelector('.sheet');
const body  = document.querySelector('.sheet__c');
const noteEl= document.getElementById('note');
const rail  = [...document.querySelectorAll('.rail__i')];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let current = null, timer = null, mail = 'ruhaanroyce@gmail.com';
// Keyed by state id, one entry per OTP screen this file owns. `A5` was here
// for the email-OTP-over-profile state deleted 2026-08-17 and was already
// unread; dropped 2026-08-19 while this file's STATES were rewritten anyway.
const code = {A3: ''};

/* Every state is addressable: #A3 opens on the mobile OTP, #S0 holds the
   splash instead of letting it advance. Reviewers need to link a single state,
   and a splash that always runs away is unscreenshottable. */
function stamp(id){
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
}

function railMark(id){
  rail.forEach(b => b.setAttribute('aria-current', String(b.dataset.to === id)));
  const s = STATES.find(x => x.id === id);
  if (s && s.note) noteEl.innerHTML = s.note;
}

/* Height is animated rather than left to reflow: the sheet is one surface that
   RESIZES between states, not five sheets that replace each other. */
function paint(id, stagger){
  const s = STATES.find(x => x.id === id);
  if (!s || !s.inner) return;
  sheet.dataset.align = s.align;
  body.innerHTML = s.inner;
  body.removeAttribute('data-out');
  /* First arrival staggers its children; every later swap animates the block
     as one. Setting both would double-animate each child. */
  body.classList.toggle('sheet__c--stagger', !!stagger);
  if (!stagger) body.setAttribute('data-in','');
  const mailEl = body.querySelector('[data-mail]');
  if (mailEl) mailEl.textContent = mail;
  sheet.style.height = body.offsetHeight + 'px';
  wire(s);
}

function go(id){
  if (id === current) return;
  if (timer) { clearInterval(timer); timer = null; }
  stamp(id);

  /* The controller's chance to claim this id — an onboarding screen, an end
     card, anything that is not a sheet state. See JS_CTRL. */
  if (typeof route === 'function' && route(id)) return;
  railMark(id);

  if (id === 'S0'){
    current = 'S0';
    phone.removeAttribute('data-sheet');
    sheet.style.height = '';
    body.innerHTML = '';
    return;
  }

  const first = !phone.hasAttribute('data-sheet');
  const prev = current;
  current = id;

  if (first){                                   /* the sheet's arrival */
    paint(id, !reduce);
    requestAnimationFrame(() => phone.setAttribute('data-sheet',''));
    return;
  }
  if (prev === null || reduce){ paint(id); return; }

  sheet.style.height = body.offsetHeight + 'px';  /* pin before swapping */
  body.setAttribute('data-out','');
  setTimeout(() => paint(id), MO.fast);
}

/* --- per-state wiring ------------------------------------------------- */
function wire(s){
  const cta = body.querySelector('.s-cta[data-go]');

  // `data-phone` wiring lived here through 2026-08-18; node 2/3 verified a
  // phone number then. As of 2026-08-19 they verify email (see STATES above)
  // and the phone number moved to node 4 — build-prototype.py's own
  // `mobile_field()` / a dedicated verify sheet, a different component.
  const mailIn = body.querySelector('[data-email]');
  if (mailIn){
    mailIn.value = mail === 'ruhaanroyce@gmail.com' ? '' : mail;
    mailIn.addEventListener('input', () => {
      const ok = /^[^@\s]+@[^@\s.]+\.[^@\s]{2,}$/.test(mailIn.value.trim());
      cta.disabled = !ok;
      if (ok) mail = mailIn.value.trim();
    });
    cta.disabled = true;
    focus(mailIn);
  }

  const otp = body.querySelector('[data-otp]');
  if (otp){
    const step = otp.dataset.otp, input = otp.querySelector('.s-otp__in');
    input.value = code[step] || '';
    render(otp, input.value);
    cta.disabled = input.value.length !== 4;
    input.addEventListener('input', () => {
      input.value = input.value.replace(/\D/g,'').slice(0,4);
      code[step] = input.value;
      render(otp, input.value);
      cta.disabled = input.value.length !== 4;
    });
    otp.addEventListener('click', () => input.focus());
    focus(input);
    countdown(otp);
  }

  body.querySelectorAll('[data-go]').forEach(b => {
    b.addEventListener('click', () => { if (!b.disabled) go(b.dataset.go); });
  });
}

function focus(el){ if (!matchMedia('(hover: none)').matches) setTimeout(() => el.focus(), MO.base); }

function render(otp, val){
  [...otp.querySelectorAll('i')].forEach((box, i) => {
    const ch = val[i] || '';
    if (box.textContent !== ch){
      box.textContent = ch;
      if (ch) { box.setAttribute('data-filled',''); }
      else box.removeAttribute('data-filled');
    }
    box.toggleAttribute('data-at', i === val.length && val.length < 4);
  });
}

/* The countdown is real, and it is visible from t=0 rather than after a
   failure — that was true of the old build and is kept. */
function countdown(scope){
  const lab = scope.parentNode.querySelector('[data-resend]');
  const btn = scope.parentNode.querySelector('[data-resendbtn]');
  if (!lab) return;
  let left = RESEND_S;
  const tick = () => {
    left -= 1;
    if (left <= 0){
      clearInterval(timer); timer = null;
      lab.hidden = true; btn.hidden = false;
      return;
    }
    lab.innerHTML = 'Resend OTP in <b>' + left + 's</b>';
  };
  lab.innerHTML = 'Resend OTP in <b>' + left + 's</b>';
  lab.hidden = false; btn.hidden = true;
  if (timer) clearInterval(timer);
  timer = setInterval(tick, 1000);
  btn.addEventListener('click', () => { left = RESEND_S + 1; lab.hidden = false;
    btn.hidden = true; if (timer) clearInterval(timer); timer = setInterval(tick, 1000); tick(); });
}


/* This file's controller. The merged flow (build-first-run.py) replaces
   everything below with its own `route()` and boot, and reuses everything
   above unchanged. */

/* Only one id here is not a sheet state: the end card. */
function route(id){
  if (id === 'DONE'){
    phone.setAttribute('data-done','');
    railMark('A3'); current = 'DONE';
    return true;
  }
  phone.removeAttribute('data-done');
  return false;
}

/* --- splash ----------------------------------------------------------- */
let splashTimer = null;
function splash(hold){
  go('S0');
  clearTimeout(splashTimer);
  if (hold) return;                       /* #S0 — held open for review */
  splashTimer = setTimeout(() => { if (current === 'S0') go('A1'); }, MO.splashHold);
}
phone.addEventListener('click', e => {
  if (current === 'S0' && !e.target.closest('.sheet')) { clearTimeout(splashTimer); go('A1'); }
});

rail.forEach(b => b.addEventListener('click', () => {
  clearTimeout(splashTimer);
  b.dataset.to === 'S0' ? splash() : go(b.dataset.to);
}));
document.querySelector('[data-restart]').addEventListener('click', splash);

addEventListener('resize', () => { if (current && current !== 'S0') sheet.style.height = body.offsetHeight + 'px'; });

const at = location.hash.slice(1).toUpperCase();
if (at === 'S0') splash(true);
else if (STATES.some(s => s.id === at)) go(at);
else splash();
</script>
<script>
/* fitPhone(opts) — scale .phone to fit .stage. See docs/features/_phone_fit.py
   opts: {phone, stage, padY, padX, subtract:[selector,...], min}
   `subtract` is for harnesses that put a caption in the stage beside the
   phone — My Home does — so the phone fits the space actually left. */
function fitPhone(opts){
  var o = opts || {};
  var p = document.querySelector(o.phone || '.phone');
  var st = document.querySelector(o.stage || '.stage');
  if (!p || !st) return;
  var sub = 0;
  (o.subtract || []).forEach(function(sel){
    var e = document.querySelector(sel);
    if (e) sub += e.offsetHeight;
  });
  var padY = o.padY == null ? 24 : o.padY;
  var padX = o.padX == null ? 24 : o.padX;
  var sc = Math.min(1,
    (st.clientHeight - padY - sub) / 844,
    (st.clientWidth - padX) / 390);
  /* A stage measured before layout settles can report 0; clamping keeps the
     phone visible instead of collapsing it to nothing. */
  p.style.transform = 'scale(' + Math.max(o.min == null ? 0.25 : o.min, sc) + ')';
}

/* Re-fit on anything that can change the space available. ResizeObserver
   rather than window resize alone: inside the Vercel dashboard these run in
   an iframe whose element can be resized without the inner window firing
   anything, which is exactly the case that was cropping. */
function watchPhoneFit(opts){
  var run = function(){ fitPhone(opts); };
  run();
  addEventListener('resize', run);
  addEventListener('load', run);
  if (window.ResizeObserver) {
    var st = document.querySelector((opts || {}).stage || '.stage');
    if (st) new ResizeObserver(run).observe(st);
  }
  /* Web fonts land after first paint and can change a caption's height. */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(run);
  return run;
}

watchPhoneFit({padY: 16, padX: 16});</script></body></html>
